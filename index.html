<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Internet Weight Riddle</title>
    <style>
        :root {
            --primary-blue: #0077b6;
            --light-blue: #caf0f8;
            --background-blue: #e0f7fa;
            --white: #ffffff;
            --dark-text: #03045e;
            --option-hover: #ade8f4;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--background-blue);
            color: var(--dark-text);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }

        .container {
            background-color: var(--white);
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0, 119, 182, 0.15);
            padding: 30px;
            max-width: 500px;
            width: 100%;
            border: 2px solid var(--light-blue);
        }

        h1, h2 {
            text-align: center;
            color: var(--primary-blue);
            margin-top: 0;
        }

        .riddle-box {
            background-color: var(--light-blue);
            padding: 15px;
            border-radius: 8px;
            font-size: 1.1em;
            margin-bottom: 20px;
            text-align: center;
            line-height: 1.4;
        }

        .timer {
            font-size: 1.5em;
            font-weight: bold;
            text-align: center;
            color: var(--primary-blue);
            margin-bottom: 20px;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 20px;
        }

        input {
            padding: 12px;
            border: 2px solid var(--light-blue);
            border-radius: 6px;
            font-size: 1em;
            outline: none;
        }

        input:focus {
            border-color: var(--primary-blue);
        }

        .options-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-top: 10px;
        }

        .option-btn {
            padding: 12px;
            background-color: var(--light-blue);
            color: var(--dark-text);
            border: 2px solid var(--primary-blue);
            border-radius: 6px;
            font-size: 1em;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .option-btn:hover {
            background-color: var(--option-hover);
            transform: translateY(-2px);
        }

        .admin-btn {
            padding: 12px;
            background-color: var(--primary-blue);
            color: var(--white);
            border: none;
            border-radius: 6px;
            font-size: 1em;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }

        .admin-btn:hover {
            background-color: #005f92;
        }

        #message {
            text-align: center;
            font-weight: bold;
            margin-bottom: 15px;
        }

        .leaderboard {
            margin-top: 30px;
            border-top: 2px solid var(--light-blue);
            padding-top: 20px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
        }

        th, td {
            padding: 10px;
            text-align: left;
            border-bottom: 1px solid var(--light-blue);
        }

        th {
            background-color: var(--light-blue);
            color: var(--dark-text);
        }

        .admin-controls {
            display: flex;
            gap: 10px;
            margin-bottom: 10px;
        }

        .hidden {
            display: none;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>The Internet Riddle</h1>
    
    <div class="riddle-box">
        In 1999, the University of Chicago measured the total weight of the internet. How much did it weigh?
    </div>

    <div class="timer" id="timer">0.0s</div>

    <div id="game-form" class="input-group">
        <input type="text" id="player-name" placeholder="Enter your name first" required>
        
        <div class="options-grid">
            <button class="option-btn" onclick="submitAnswer('5g')">5g</button>
            <button class="option-btn" onclick="submitAnswer('50g')">50g</button>
            <button class="option-btn" onclick="submitAnswer('500g')">500g</button>
            <button class="option-btn" onclick="submitAnswer('5kg')">5kg</button>
        </div>
    </div>

    <div id="message"></div>

    <div class="admin-controls">
        <input type="password" id="admin-key" placeholder="Enter owner key to view leaderboard" style="flex-grow: 1;">
        <button class="admin-btn" onclick="toggleLeaderboard()">Access</button>
    </div>

    <div id="leaderboard-section" class="leaderboard hidden">
        <h2>Leaderboard (Owner View)</h2>
        <table>
            <thead>
                <tr>
                    <th>Name</th>
                    <th>Time</th>
                </tr>
            </thead>
            <tbody id="leaderboard-body">
                </tbody>
        </table>
    </div>
</div>

<script>
    // System Setup
    const OWNER_KEY = "admin123"; // Change this key to your secret password
    const CORRECT_ANSWER = "50g"; 
    
    let startTime = Date.now();
    let timerInterval = setInterval(updateTimer, 100);
    let gameEnded = false;

    function updateTimer() {
        if (!gameEnded) {
            const elapsed = ((Date.now() - startTime) / 1000).toFixed(1);
            document.getElementById('timer').innerText = `${elapsed}s`;
        }
    }

    function submitAnswer(selectedOption) {
        if (gameEnded) return;

        const name = document.getElementById('player-name').value.trim();
        const messageEl = document.getElementById('message');

        if (!name) {
            messageEl.style.color = "red";
            messageEl.innerText = "Please enter your name first!";
            return;
        }

        if (selectedOption === CORRECT_ANSWER) {
            gameEnded = true;
            clearInterval(timerInterval);
            const finalTime = ((Date.now() - startTime) / 1000).toFixed(2);
            
            saveScore(name, parseFloat(finalTime));
            
            messageEl.style.color = "green";
            messageEl.innerText = `Correct! ${selectedOption} is the answer. Completed in ${finalTime}s.`;
            document.getElementById('game-form').classList.add('hidden');
        } else {
            messageEl.style.color = "red";
            messageEl.innerText = "Incorrect answer. Try again!";
        }
    }

    function saveScore(name, time) {
        let leaderboard = JSON.parse(localStorage.getItem('riddleLeaderboard')) || [];
        leaderboard.push({ name: name, time: time });
        leaderboard.sort((a, b) => a.time - b.time); // Sort by fastest time
        localStorage.setItem('riddleLeaderboard', JSON.stringify(leaderboard));
    }

    function toggleLeaderboard() {
        const inputKey = document.getElementById('admin-key').value;
        const leaderboardSection = document.getElementById('leaderboard-section');

        if (inputKey === OWNER_KEY) {
            renderLeaderboard();
            leaderboardSection.classList.remove('hidden');
        } else {
            alert("Incorrect owner key.");
            leaderboardSection.classList.add('hidden');
        }
    }

    function renderLeaderboard() {
        const tbody = document.getElementById('leaderboard-body');
        const leaderboard = JSON.parse(localStorage.getItem('riddleLeaderboard')) || [];
        
        tbody.innerHTML = '';
        
        if (leaderboard.length === 0) {
            tbody.innerHTML = '<tr><td colspan="2">No submissions yet.</td></tr>';
            return;
        }

        leaderboard.forEach(entry => {
            const row = document.createElement('tr');
            row.innerHTML = `<td>${escapeHTML(entry.name)}</td><td>${entry.time}s</td>`;
            tbody.appendChild(row);
        });
    }

    function escapeHTML(str) {
        return str.replace(/[&<>'"]/g, 
            tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag)
        );
    }
</script>

</body>
</html>
